# CampusClaw edge proxy — the ONLY user-facing entry.
# Pages + user-side downloads are proxied to the app container;
# every /api/* request is answered 404 here (never forwarded),
# so the backend API is invisible to end users.
server {
    listen 80;
    server_name _;

    # allow 10MB uploads with multipart overhead headroom (app enforces 10MB)
    client_max_body_size 12m;

    # Backend API: not exposed to users — uniform 404, no existence leaks
    location /api/ {
        return 404;
    }

    # Everything else = server-rendered pages + user-side download route
    location / {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
